---

- name: Create directory for Pelican
  ansible.builtin.file:
    path: "/srv/www/{{ net_domain }}/pelican"
    state: directory

- name: Deploy Pelican Caddyfile
  ansible.builtin.template:
    src: pelican/Caddyfile.j2
    dest: "/srv/www/{{ net_domain }}/pelican/Caddyfile"

- name: Deploy Pterodactyl Docker composition
  ansible.builtin.template:
    src: pelican/docker-compose.yml.j2
    dest: "/srv/www/{{ net_domain }}/pelican/docker-compose.yml"

- name: Deploy PHP hardening configuration for Pelican
  ansible.builtin.template:
    src: php/hardening.ini.j2
    dest: "/srv/www/{{ net_domain }}/pelican/php-hardening.ini"
    mode: '0644'

- name: Deploy Pelican entrypoint wrapper
  ansible.builtin.template:
    src: pelican/entrypoint.sh.j2
    dest: "/srv/www/{{ net_domain }}/pelican/entrypoint.sh"
    mode: '0644'

- name: Bring Docker containers up
  community.docker.docker_compose_v2:
    project_src: "/srv/www/{{ net_domain }}/pelican"

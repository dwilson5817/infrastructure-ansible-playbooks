---

# root@pam remains available as a break-glass login (via an SSH port forward) if Pocket ID is unavailable
- name: List authentication realms
  ansible.builtin.command: pveum realm list --output-format json
  register: proxmox_realms
  changed_when: false

# pveum has no create-or-update, so add the realm once and then keep its settings in sync. The client secret is passed
# on the command line, so hide it from the logs, and report pveum's error separately below.
- name: Configure Pocket ID login realm
  ansible.builtin.command:
    argv: "{{ ['pveum', 'realm', proxmox_oidc_realm_command, proxmox_oidc_realm] + proxmox_oidc_create_options + proxmox_oidc_options }}"
  vars:
    proxmox_oidc_realm_exists: "{{ proxmox_oidc_realm in proxmox_realms.stdout | from_json | map(attribute='realm') }}"
    proxmox_oidc_realm_command: "{{ 'modify' if proxmox_oidc_realm_exists else 'add' }}"
    # Can only be set when the realm is created, as changing them would change every user's identity
    proxmox_oidc_create_options: "{{ [] if proxmox_oidc_realm_exists else ['--type', 'openid', '--username-claim', 'preferred_username'] }}"
    proxmox_oidc_options:
      - --issuer-url
      - "{{ proxmox_oidc_issuer_url }}"
      - --client-id
      - "{{ vault_pocket_id_clients_proxmox['client_id'] }}"
      - --client-key
      - "{{ vault_pocket_id_clients_proxmox['client_secret'] }}"
      # Only users created below may log in
      - --autocreate
      - '0'
      - --default
      - '1'
      - --comment
      - Pocket ID
  register: proxmox_oidc_realm_result
  failed_when: false
  no_log: true

- name: Report Pocket ID login realm errors
  ansible.builtin.fail:
    msg: "pveum realm failed: {{ proxmox_oidc_realm_result.stderr }}"
  when: proxmox_oidc_realm_result.rc != 0

- name: List users
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_users
  changed_when: false

- name: Create Pocket ID administrators
  ansible.builtin.command: "pveum user add {{ item }}@{{ proxmox_oidc_realm }} --comment 'Managed by Ansible'"
  loop: "{{ proxmox_oidc_admins }}"
  when: (item ~ '@' ~ proxmox_oidc_realm) not in proxmox_users.stdout | from_json | map(attribute='userid')

- name: Grant Pocket ID administrators the Administrator role
  ansible.builtin.command: "pveum acl modify / --users {{ item }}@{{ proxmox_oidc_realm }} --roles Administrator"
  loop: "{{ proxmox_oidc_admins }}"
  changed_when: false

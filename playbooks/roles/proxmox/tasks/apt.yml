- name: Disable Proxmox and Ceph enterprise repositories
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    # Proxmox VE 8 and earlier
    - pve-enterprise.list
    - ceph.list
    # Proxmox VE 9 and later use deb822 sources
    - pve-enterprise.sources
    - ceph.sources
    # Added by the OVH installer, duplicates pve-no-subscription below
    - pve-install-repo.list
  register: apt_enterprise_repos

# Proxmox VE 8 trusts the release key globally, and its gpgv can't read the combined archive keyring. Releases that
# don't install a global key must reference the archive keyring instead.
- name: Check for globally trusted Proxmox release key
  ansible.builtin.stat:
    path: "/etc/apt/trusted.gpg.d/proxmox-release-{{ ansible_distribution_release }}.gpg"
  register: proxmox_release_key

- name: Enable Proxmox Community repository
  ansible.builtin.copy:
    content: |
      deb {{ '' if proxmox_release_key.stat.exists else '[signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] ' }}http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    owner: root
    group: root
    mode: '0644'
  register: apt_community_repo

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
  when: apt_enterprise_repos.changed or apt_community_repo.changed

- name: Disable Proxmox and Ceph enterprise repositories
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    # Proxmox VE 8 and earlier
    - pve-enterprise.list
    - ceph.list
    # Proxmox VE 9 and later use deb822 sources
    - pve-enterprise.sources
    - ceph.sources
    # Added by the OVH installer, duplicates proxmox.sources below (converted to .sources by apt modernize-sources)
    - pve-install-repo.list
    - pve-install-repo.sources
    # Previous names of proxmox.sources below
    - pve-no-subscription.list
    - pve-no-subscription.sources
  register: apt_enterprise_repos

# Uses the same file name and format as the Proxmox VE 9 installer. Debian 12's gpgv can't read the combined archive
# keyring, so Proxmox VE 8 relies on the globally trusted release key instead.
- name: Enable Proxmox Community repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      {% if ansible_distribution_major_version | int >= 13 %}
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      {% endif %}
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: '0644'
  register: apt_community_repo

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
  when: apt_enterprise_repos.changed or apt_community_repo.changed

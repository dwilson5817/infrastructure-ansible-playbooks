---

proxmox_ssh_user: "{{ vault_ansible['ssh_user'] }}"

proxmox_tunnel_hostname: "proxmox.{{ net_domain }}"

# pveproxy only listens on loopback, API tasks run on the node itself
proxmox_api_host: 127.0.0.1

proxmox_token_user: root@pam
proxmox_token_id: ansible

proxmox_vm_search_domains:
  - "{{ ansible_host }}"

proxmox_vm_dns_servers:
  - '1.1.1.1'
  - '8.8.8.8'

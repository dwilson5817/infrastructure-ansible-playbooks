---

# Runs when backups_rsync_net_enabled is false.  Skipping the include instead
# would leave the cron jobs, SSH config and key behind on every host forever,
# so retirement has to be an action rather than an absence of one.

- name: Remove cron jobs for rsync.net backups
  ansible.builtin.cron:
    name: "Backup job: {{ item.key }}"
    state: absent
  loop: "{{ backups_jobs | dict2items }}"

- name: Check whether an SSH config exists
  ansible.builtin.stat:
    path: /root/.ssh/config
  register: rsync_net_ssh_config

- name: Remove SSH config entry for rsync.net
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    # rsync_net.yml predates the per destination markers and used the default.
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    state: absent
  when: rsync_net_ssh_config.stat.exists

- name: Remove the rsync.net SSH key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/id_ed25519_rsync_net
    - /root/.ssh/id_ed25519_rsync_net.pub
    # Only present if a previous run failed between writing and removing it.
    - /root/.ssh/id_ed25519_rsync_net_master

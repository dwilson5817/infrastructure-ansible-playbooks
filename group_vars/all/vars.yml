---

ansible_hashi_vault_engine_mount_point: secrets/infrastructure/ansible-playbooks

vault_acme: "{{ lookup('community.hashi_vault.vault_kv2_get', 'all/acme')['secret'] }}"
vault_ansible: "{{ lookup('community.hashi_vault.vault_kv2_get', 'all/ansible')['secret'] }}"
vault_cloudflare: "{{ lookup('community.hashi_vault.vault_kv2_get', 'all/cloudflare')['secret'] }}"
vault_prometheus_exporters_users: "{{ lookup('community.hashi_vault.vault_kv2_get', 'all/exporters/users')['secret'] }}"
vault_hetzner: "{{ lookup('community.hashi_vault.vault_kv2_get', 'hetzner/storage-box')['secret'] }}"
vault_aws_roles_anywhere: "{{ lookup('community.hashi_vault.vault_kv2_get', 'aws/roles-anywhere/backups/' + ansible_fqdn, errors='ignore')['secret'] | default(omit, true) }}"

ansible_ssh_user: "{{ vault_ansible['ssh_user'] }}"

net_domain: dylanw.net
dev_domain: dylanw.dev

gitlab_url: "https://gitlab.{{ dev_domain }}"

acme_contact: "{{ vault_acme['contact_email'] }}"
acme_directory: https://acme-v02.api.letsencrypt.org/directory

cloudflare_api_token: "{{ vault_cloudflare['api_token'] }}"
cloudflare_account_id: "{{ vault_cloudflare['account_id'] }}"
cloudflare_zone_id: "{{ vault_cloudflare['zone_id'] }}"

node_exporter_basic_auth_users: "{{ vault_prometheus_exporters_users }}"
mysqld_exporter_basic_auth_users: "{{ vault_prometheus_exporters_users }}"

hetzner_api_token: "{{ vault_hetzner['api_token'] }}"
hetzner_storage_box: "{{ vault_hetzner['storage_box'] }}"

aws_backups_bucket: "{{ vault_aws_roles_anywhere['backups_bucket'] | default(none) }}"
aws_profile_arn: "{{ vault_aws_roles_anywhere['profile_arn'] | default(none) }}"
aws_role_arn: "{{ vault_aws_roles_anywhere['role_arn'] | default(none) }}"
aws_trust_anchor_arn: "{{ vault_aws_roles_anywhere['trust_anchor_arn'] | default(none) }}"
